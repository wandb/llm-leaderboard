wandb:
  run_name: "anthropic/claude-fable-5: high-effort"
api: anthropic
batch_size: 4
model:
  pretrained_model_name_or_path: claude-fable-5
  bfcl_model_id: "Claude-FC"
  base_model: "unknown"
  size_category: api
  size: null
  release_date: 6/9/2026

# Fable 5 always uses adaptive thinking. Manual budget_tokens is invalid;
# output_config.effort is populated by AnthropicClient and ClaudeHandler.
generator:
  max_tokens: 128000
  effort: high

