arc_agi:
  error_handling:
    request_failure:
      mode: hard
  arc_agi_1_artifacts_path: "llm-leaderboard/nejumi-leaderboard4/arc-agi-1_public-eval_50:production"
  arc_agi_2_artifacts_path: "llm-leaderboard/nejumi-leaderboard4/arc-agi-2_public-eval_50:production"
  max_output_tokens: 4096
  num_attempts: 2
  prompt_template: |
    你正在參加解謎競賽。你是一位擅長解這類格狀圖形謎題的專家。
    以下是一組輸入與輸出的訓練範例。你的目標是找出訓練範例中從輸入到輸出的轉換規則，並將同一規則套用到測試輸入，產生最終輸出。

    請完全依照訓練輸出範例的 JSON 格式作答，只輸出最終的二維數字陣列。

    --訓練範例--
    {training_examples}
    --訓練範例結束--

    --測試輸入--
    {test_input}
    --測試輸入結束--

