wandb:
  entity: 'llm-leaderboard'
  project: 'tc-leaderboard'
  expected_entity: 'llm-leaderboard'
  expected_project: 'tc-leaderboard'

testmode: false
inference_interval: 0

output:
  allow_legacy_benchmark_checkpoint_migration: false
  trust_completed_checkpoint_fingerprint_mismatch: []

error_handling:
  request_failure:
    mode: hard

provider_rate_limit:
  enabled: false
  key: null
  min_request_interval_sec: 0.0
  request_jitter_sec: 0.0

network:
  progress_interval_sec: 60
  http_timeout:
    connect: 10.0
    read: 300.0
    write: 300.0
    pool: 30.0
  retry:
    # Item checkpoints preserve completed work, so a sustained outage should
    # fail clearly instead of holding the entire benchmark for up to 30 minutes.
    max_time_sec: 300
    max_tries: 8

openai:
  http_timeout:
    connect: 10.0
    read: 300.0
    write: 300.0
    pool: 30.0

xai:
  http_timeout:
    connect: 10.0
    read: 300.0
    write: 300.0
    pool: 30.0

azure_openai:
  http_timeout:
    connect: 10.0
    read: 300.0
    write: 300.0
    pool: 30.0

model:
  artifact_path: null

vllm:
  vllm_tag: latest
  disable_triton_mma: false
  lifecycle: auto
  dtype: null
  max_model_len: null
  device_map: null
  gpu_memory_utilization: null
  reasoning_parser: null
  trust_remote_code: false
  chat_template: null
  enable_auto_tool_choice: false
  tool_call_parser: null
  extra_args: []

generator:
  top_p: 1.0
  temperature: 0.1
  max_tokens: 128

num_few_shots: 2

run:
  agentic_math: false
  bfcl: true
  swebench: false
  swebench_pro: false
  deepswe: false
  agentic_swe_assorted: false
  mtbench: true
  jbbq: false
  toxicity: false
  jtruthfulqa: false
  hle: true
  hallulens: false
