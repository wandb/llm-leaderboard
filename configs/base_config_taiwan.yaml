bfcl:
  version: "v4"
  profile: "full"
  artifact_profile: "full"
  test_category: "simple_python simple_java simple_javascript multiple irrelevance live_simple live_multiple live_irrelevance live_relevance multi_turn_base multi_turn_miss_func multi_turn_miss_param memory_kv memory_vector memory_rec_sum web_search_base web_search_no_snippet"
  temperature: 0.01
  num_threads: 4
  provider_min_request_interval_sec: 2.0
  provider_request_jitter_sec: 0.5
  request_timeout_sec: 300
  case_timeout_sec: 600
  case_timeout_retries: 0
  resume_existing_results: true
  retry_failed_cases: true
  consecutive_failure_fail_fast: 5
  progress_poll_sec: 5
  artifacts_path: 'llm-leaderboard/tc-leaderboard/bfcl-v4-zh-tw:production'
  web_search:
    backend: "ddgs"
    ddgs_backend: "auto"
    endpoint: "https://html.duckduckgo.com/html/"
    timeout_sec: 20
    max_attempts: 4
    retry_base_sec: 2
    min_request_interval_sec: 2
    request_jitter_sec: 0.25
    cache_path: "outputs/bfcl_v4/web_search_cache.sqlite3"
    cache_ttl_sec: 0
    fetch_max_bytes: 2000000
    fetch_max_chars: 20000
  generator_config:
    max_tokens: 8096
    temperature: 0.01
    top_p: 1.0
  handler_config:
    openai_responses:
      inject_bfcl_fc_system_prompt: false
    unified_oss_fc:
      skip_hf_tokenizer: false
      max_context_length_override: null
    unified_oss_jsonschema:
      execution_result_include_call_str: true
      execution_result_include_call_id: false
      execution_result_join_parallel_calls: true
      execution_result_role: "tool"

