preset:
  name: wandb-weave
  description: W&B Weave trace export for Nejumi Taiwan NeMoClaw runs
network_policies:
  wandb-weave:
    name: wandb-weave
    endpoints:
      - host: api.wandb.ai
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /**
          - allow:
              method: POST
              path: /**
          - allow:
              method: PUT
              path: /**
      - host: trace.wandb.ai
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /**
          - allow:
              method: POST
              path: /**
          - allow:
              method: PUT
              path: /**
      - host: api.inference.wandb.ai
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /v1/models
          - allow:
              method: GET
              path: /v1/models/**
          - allow:
              method: POST
              path: /v1/chat/completions
      - host: wandb.ai
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /**
          - allow:
              method: POST
              path: /**
      - host: api.openai.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /v1/models
          - allow:
              method: GET
              path: /v1/models/**
          - allow:
              method: POST
              path: /v1/responses
          - allow:
              method: POST
              path: /v1/chat/completions
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /v1/models
          - allow:
              method: GET
              path: /v1/models/**
          - allow:
              method: POST
              path: /v1/messages
    binaries:
      - path: /usr/local/bin/openclaw
      - path: /usr/local/bin/node
      - path: /usr/bin/node
