wandb:
  run_name: taiwan/full/google/gemini-3.1-pro-preview
api: openai-compatible
base_url: https://openrouter.ai/api/v1
batch_size: 4
inference_interval: 1
model:
  pretrained_model_name_or_path: google/gemini-3.1-pro-preview
  bfcl_model_id: OpenRouter-FC
  base_model: unknown
  size_category: api
  size: null
  release_date: 2/1/2026
generator:
  temperature: null
  top_p: null
  parallel_tool_calls: true
  max_tokens: 65000
  extra_body:
    reasoning:
      enabled: true
    provider:
      allow_fallbacks: true
jaster:
  override_max_tokens: 65000
jbbq:
  generator_config:
    max_tokens: 65000
toxicity:
  generator_config:
    max_tokens: 65000
    temperature: null
    top_p: null
jtruthfulqa:
  generator_config:
    max_tokens: 65000
swebench:
  max_tokens: 65000
mtbench:
  generator_config:
    max_tokens: 65000
    temperature: null
    top_p: null
  temperature_override:
    writing: null
    roleplay: null
    extraction: null
    math: null
    coding: null
    reasoning: null
    stem: null
    humanities: null
bfcl:
  generator_config:
    max_tokens: 65000
    temperature: null
    top_p: null
  allow_overwrite: false
hallulens:
  generator_config:
    max_tokens: 65000
    temperature: null
    top_p: null
hle:
  generator_config:
    max_tokens: 65000
arc_agi:
  max_output_tokens: 65000
m_ifeval:
  generator_config:
    max_tokens: 65000
testmode: false
run:
  agentic_math: true
  bfcl: false
  swebench: false
  swebench_pro: true
  mtbench: false
  jbbq: false
  toxicity: false
  jtruthfulqa: false
  hle: false
  hallulens: false
  hallulens_zh_tw: false
  arc_agi: false
  m_ifeval: false
  ifeval_zh_tw: false
  ts_bench: false
  twbias: false
  tceval_v2: false
  script_adherence: false
  jaster: false
  jmmlu_robustness: false
  tmmluplus_robustness: false
  aggregate: false
  aggregate_taiwan: true
agentic_math:
  subset: leaderboard
  output_dir: outputs/taiwan_full_eval/agentic_math/gemini-3_1-pro-preview-openrouter
  prefix: taiwan-math-gemini-3_1-pro-preview-openrouter
  task_agent_prefix: tw-math-gemini-3_1-pro-preview-openrouter
  openclaw_model: openrouter-direct/google/gemini-3.1-pro-preview
  thinking: high
  openclaw_max_attempts: 3
  openclaw_retry_base_seconds: 15
  max_input_tokens: 500000
  max_tool_calls: 40
  max_agent_turns: 40
  verify_weave_agents: true
  weave_agents_entity: 'llm-leaderboard'
  weave_agents_project: 'tc-leaderboard'
  weave_agents_agent_name: 'nejumi-taiwan-openclaw'
  weave_agents_limit: 50
  weave_agents_verification_timeout: 120
  weave_agents_poll_seconds: 5
  dry_run: false
  run_openclaw: false
  results_dir: outputs/taiwan_full_eval/agentic_math/gemini-3_1-pro-preview-openrouter/openclaw
  no_local: true
  weave_sidecar: false
  weave_sidecar_strict: false
  openclaw_tool_profile: coding
  deny_tool:
  - code_execution
  - process
  - process_*
  - web_search
  - web_fetch
  - browser
  - browser_*
  deny_argument_pattern:
  - https?://
  - \b(curl|wget)\b
  - \b(requests|urllib|httpx)\.
swebench_pro:
  subset: leaderboard_compact_80
  output_dir: outputs/taiwan_full_eval/swebench_pro/gemini-3_1-pro-preview-openrouter
  checkout_root: outputs/taiwan_full_eval/swebench_pro_checkouts/gemini-3_1-pro-preview-openrouter
  prefix: taiwan-swe-gemini-3_1-pro-preview-openrouter
  task_agent_prefix: tw-swe-gemini-3_1-pro-preview-openrouter
  openclaw_model: openrouter-direct/google/gemini-3.1-pro-preview
  thinking: high
  openclaw_max_attempts: 3
  openclaw_retry_base_seconds: 15
  dry_run: false
  run_openclaw: false
  patch_path: outputs/taiwan_full_eval/swebench_pro/gemini-3_1-pro-preview-openrouter/openclaw/patches.json
  evaluate: true
  no_local: true
  weave_sidecar: false
  weave_sidecar_strict: false
  openclaw_tool_profile: coding
  max_input_tokens: 1000000
  max_tool_calls: 40
  max_agent_turns: 40
  verify_weave_agents: true
  weave_agents_entity: 'llm-leaderboard'
  weave_agents_project: 'tc-leaderboard'
  weave_agents_agent_name: 'nejumi-taiwan-openclaw'
  weave_agents_limit: 50
  weave_agents_verification_timeout: 120
  weave_agents_poll_seconds: 5
  deny_tool:
  - code_execution
  - process
  - process_*
  - web_search
  - web_fetch
  - browser
  - browser_*
  deny_argument_pattern:
  - https?://
  - \b(curl|wget)\b
  - \b(requests|urllib|httpx)\.
