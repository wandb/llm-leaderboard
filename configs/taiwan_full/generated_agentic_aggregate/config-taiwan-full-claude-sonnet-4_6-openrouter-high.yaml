  openclaw_max_attempts: 3
  openclaw_retry_base_seconds: 15
  dry_run: false
  run_openclaw: false
  patch_path: outputs/taiwan_full_eval/swebench_pro/claude-sonnet-4_6-openrouter-high/openclaw/patches.json
  evaluate: true
  weave_sidecar: false
  weave_sidecar_strict: false
  openclaw_tool_profile: coding
  max_input_tokens: 1000000
  max_tool_calls: 60
  deny_tool:
  - code_execution
  - web_search
  - web_fetch
  - browser
  - browser_*
  - '*search*'
  deny_argument_pattern:
  - https?://
  - \b(curl|wget)\b
  - \b(requests|urllib|httpx)\.
