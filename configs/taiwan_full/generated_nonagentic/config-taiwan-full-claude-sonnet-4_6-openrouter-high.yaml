wandb:
  run_name: 'taiwan/full/anthropic/claude-sonnet-4.6: extended-thinking'
api: openai-compatible
base_url: https://openrouter.ai/api/v1
batch_size: 32
model:
  pretrained_model_name_or_path: anthropic/claude-sonnet-4.6
  bfcl_model_id: OpenRouter-FC
  base_model: unknown
  size_category: api
  size: null
  release_date: 2/17/2026
generator:
  parallel_tool_calls: true
  max_tokens: 64000
  extra_body:
    reasoning:
      max_tokens: 51200
jaster:
  override_max_tokens: 64000
jbbq:
  generator_config:
    max_tokens: 64000
toxicity:
  generator_config:
    max_tokens: 64000
jtruthfulqa:
  generator_config:
    max_tokens: 64000
mtbench:
  max_new_token: 64000
bfcl:
  generator_config:
    max_tokens: 64000
  allow_overwrite: false
hallulens:
  generator_config:
    max_tokens: 64000
hle:
  max_completion_tokens: 64000
arc_agi:
  max_output_tokens: 64000
m_ifeval:
  generator_config:
    max_tokens: 64000
swebench:
  max_tokens: 64000
testmode: false
run:
  agentic_math: false
  bfcl: true
  swebench: false
  swebench_pro: false
  mtbench: true
  jbbq: false
  toxicity: false
  jtruthfulqa: false
  hle: true
  hallulens: false
  hallulens_zh_tw: true
  arc_agi: true
  m_ifeval: false
  ifeval_zh_tw: true
  ts_bench: true
  twbias: false
  tceval_v2: true
  script_adherence: true
  jaster: true
  jmmlu_robustness: false
  tmmluplus_robustness: true
  aggregate: false
  aggregate_taiwan: false
agentic_math:
  subset: leaderboard
  output_dir: outputs/taiwan_full_eval/agentic_math/claude-sonnet-4_6-openrouter-high
  prefix: taiwan-math-claude-sonnet-4_6-openrouter-high
  task_agent_prefix: tw-math-claude-sonnet-4_6-openrouter-high
  openclaw_model: openrouter-direct/anthropic/claude-sonnet-4.6
  thinking: high
  openclaw_max_attempts: 3
  openclaw_retry_base_seconds: 15
  max_input_tokens: 500000
  max_tool_calls: 40
  max_agent_turns: 40
  verify_weave_agents: true
  weave_agents_entity: 'llm-leaderboard'
  weave_agents_project: 'tc-leaderboard'
  weave_agents_agent_name: 'nejumi-taiwan-openclaw'
  weave_agents_limit: 50
  weave_agents_verification_timeout: 120
  weave_agents_poll_seconds: 5
  dry_run: false
  run_openclaw: true
  results_dir: null
  no_local: true
  weave_sidecar: false
  weave_sidecar_strict: false
  openclaw_tool_profile: coding
  deny_tool:
  - code_execution
  - process
  - process_*
  - web_search
  - web_fetch
  - browser
  - browser_*
  deny_argument_pattern:
  - https?://
  - \b(curl|wget)\b
  - \b(requests|urllib|httpx)\.
swebench_pro:
  subset: leaderboard_compact_80
  output_dir: outputs/taiwan_full_eval/swebench_pro/claude-sonnet-4_6-openrouter-high
  checkout_root: outputs/taiwan_full_eval/swebench_pro_checkouts/claude-sonnet-4_6-openrouter-high
  prefix: taiwan-swe-claude-sonnet-4_6-openrouter-high
  task_agent_prefix: tw-swe-claude-sonnet-4_6-openrouter-high
  openclaw_model: openrouter-direct/anthropic/claude-sonnet-4.6
  thinking: high
  openclaw_max_attempts: 3
  openclaw_retry_base_seconds: 15
  dry_run: false
  run_openclaw: true
  patch_path: null
  evaluate: true
  no_local: true
  weave_sidecar: false
  weave_sidecar_strict: false
  openclaw_tool_profile: coding
  max_input_tokens: 1000000
  max_tool_calls: 40
  max_agent_turns: 40
  verify_weave_agents: true
  weave_agents_entity: 'llm-leaderboard'
  weave_agents_project: 'tc-leaderboard'
  weave_agents_agent_name: 'nejumi-taiwan-openclaw'
  weave_agents_limit: 50
  weave_agents_verification_timeout: 120
  weave_agents_poll_seconds: 5
  deny_tool:
  - code_execution
  - process
  - process_*
  - web_search
  - web_fetch
  - browser
  - browser_*
  deny_argument_pattern:
  - https?://
  - \b(curl|wget)\b
  - \b(requests|urllib|httpx)\.
