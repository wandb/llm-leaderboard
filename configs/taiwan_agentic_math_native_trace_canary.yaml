wandb:
  run_name: 'taiwan/trace-canary/agentic-math-gpt-4.1-mini-native-weave-main-agent'

api: openai_responses
batch_size: 1
model:
  pretrained_model_name_or_path: gpt-4.1-mini-2025-04-14
  base_model: unknown
  size_category: api
  size: null
  release_date: 4/14/2025

testmode: false

run:
  agentic_math: true
  bfcl: false
  swebench: false
  swebench_pro: false
  mtbench: false
  jbbq: false
  toxicity: false
  jtruthfulqa: false
  hle: false
  hallulens: false
  hallulens_zh_tw: false
  arc_agi: false
  m_ifeval: false
  ifeval_zh_tw: false
  ts_bench: false
  twbias: false
  tceval_v2: false
  script_adherence: false
  jaster: false
  jmmlu_robustness: false
  tmmluplus_robustness: false
  aggregate: false
  aggregate_taiwan: false

agentic_math:
  subset: leaderboard
  limit: 1
  output_dir: outputs/taiwan_trace_canary/agentic_math_gpt_4_1_mini_native_weave_main_agent
  prefix: taiwan-trace-canary-math-gpt-4-1-mini
  task_agent_prefix: tw-trace-math-gpt-4-1-mini
  openclaw_model: openai-direct/gpt-4.1-mini-2025-04-14
  thinking: 'off'
  openclaw_max_attempts: 1
  openclaw_retry_base_seconds: 0
  max_input_tokens: 500000
  max_tool_calls: 40
  max_agent_turns: 40
  verify_weave_agents: true
  weave_agents_entity: 'llm-leaderboard'
  weave_agents_project: 'tc-leaderboard'
  weave_agents_agent_name: 'nejumi-taiwan-openclaw'
  weave_agents_limit: 80
  weave_agents_verification_timeout: 180
  weave_agents_poll_seconds: 5
  dry_run: false
  run_openclaw: true
  no_local: true
  weave_sidecar: false
  weave_sidecar_strict: false
  openclaw_tool_profile: coding
  deny_tool:
    - code_execution
    - process
    - process_*
    - web_search
    - web_fetch
    - browser
    - browser_*
  deny_argument_pattern:
    - https?://
    - \b(curl|wget)\b
    - \b(requests|urllib|httpx)\.
  nemoclaw_sandbox: nejumi-taiwan
  nemoclaw_bin: nemoclaw
  nemoclaw_workdir: /sandbox
  use_task_agent: false
  nemoclaw_openclaw_config_path: /sandbox/.openclaw/openclaw.json
