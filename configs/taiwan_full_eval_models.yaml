models:
  - slug: glm-5_2-openrouter-reasoning
    source_config: config-zai-glm-5_2-openrouter.yaml
    run_name: "taiwan/full/z-ai/glm-5.2: openrouter-reasoning"
    japanese_runname: "z-ai/glm-5.2: openrouter-reasoning-xhigh"
    openclaw_model: "openrouter-direct/z-ai/glm-5.2"
    openclaw_model_overrides:
      maxTokens: 4096
    openclaw_model_params:
      provider:
        order:
          - z-ai/fp8
        only:
          - z-ai/fp8
        allow_fallbacks: false
        require_parameters: true
    reasoning_effort: null
    agentic_thinking: high
    swe_thinking: high
    math_limit: 50
    math_openclaw_timeout: 900
    swe_subset: "leaderboard_compact_40"
    canary: true
    notes: "Preferred one-model full canary before multi-model expansion."

